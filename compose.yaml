name: infraorgit

services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: infraorgit
      MYSQL_USER: infraorgit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definisci MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definisci MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mysql-keycloak:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?definisci KEYCLOAK_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:?definisci KEYCLOAK_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-keycloak-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${KC_MODE:-prod}" = "dev" ]; then
          exec /opt/keycloak/bin/kc.sh start-dev --import-realm
        fi
        export KC_HOSTNAME="$${KEYCLOAK_HOSTNAME:-https://localhost}"
        export KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
        export KC_PROXY_HEADERS=xforwarded
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_MODE: ${KC_MODE:-prod}
      KEYCLOAK_HOSTNAME: ${SITE_URL:-https://localhost}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql-keycloak:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?definisci KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?definisci KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-infraorgit.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      mysql-keycloak:
        condition: service_healthy
    networks:
      - default
      - auth

  mysql-legacy:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    profiles: ["legacy"]
    restart: "no"
    environment:
      MYSQL_DATABASE: infraorgit_legacy
      MYSQL_USER: legacy
      MYSQL_PASSWORD: ${LEGACY_DB_PASSWORD:-dev-legacy-password}
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_ROOT_PASSWORD:-dev-legacy-root-password}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ./legacy:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1 FROM infraorgit_legacy.Servers LIMIT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: infraorgit-api:${API_TAG:-local}
    build:
      context: ../InfraOrgITApi
    command: ["migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=infraorgit;User ID=infraorgit;Password=${MYSQL_PASSWORD};"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  api:
    image: infraorgit-api:${API_TAG:-local}
    build:
      context: ../InfraOrgITApi
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=infraorgit;User ID=infraorgit;Password=${MYSQL_PASSWORD};"
      Oidc__Issuer: ${OIDC_ISSUER:-https://localhost/realms/infraorgit}
      Oidc__InternalIssuer: ${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/infraorgit}
      Oidc__AllowInsecureInternalDiscovery: "true"
      Oidc__ClientId: ${OIDC_CLIENT_ID:-infraorgit}
      Oidc__ClientSecret: ${Oidc__ClientSecret:?definisci Oidc__ClientSecret in .env}
      Oidc__RedirectUri: ${OIDC_REDIRECT_URI:-https://localhost/auth/callback}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-https://localhost}
      Auth__SecureCookies: "true"
      ServerAccess__CredentialKeys__1: ${ServerAccess__CredentialKey:-}
      ServerAccess__CurrentKeyVersion: ${ServerAccess__CurrentKeyVersion:-1}
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      SessionStore__MaxSessionsPerUser: ${SESSION_MAX_PER_USER:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ForwardedHeaders__KnownNetworks: ${FORWARDED_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - api-dp-keys:/home/app/.aspnet/DataProtection-Keys
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - default
      - auth

  web:
    image: infraorgit-web:${WEB_TAG:-local}
    build:
      context: ../InfraOrgITWeb
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-keycloak:8080}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

networks:
  auth:
    internal: true

volumes:
  mysql-data:
  mysql-keycloak-data:
  api-dp-keys:
  caddy-data:
  caddy-config:
