name: docker

on:
  push:
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara env di esempio
        run: cp .env.example .env
      - name: Valida Compose
        run: docker compose config -q
      - name: Valida realm Keycloak
        run: jq empty keycloak/realm-infraorgit.json
      - name: Valida Caddyfile
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
