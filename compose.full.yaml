# Override del profilo full: Keycloak in modalità production dietro Caddy.
# Used by `make full` together with compose.yaml; it does not change development (`make dev`).
services:
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${SITE_URL:-https://localhost}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
