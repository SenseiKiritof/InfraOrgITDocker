# Override del profilo full: Keycloak in modalità production dietro Caddy.
# Usato da `make full` insieme a compose.yaml; non cambia lo sviluppo (`make dev`).
services:
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${SITE_URL:-https://localhost}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
